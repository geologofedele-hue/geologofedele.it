    <ellipse cx="75" cy="55" rx="70" ry="20" fill="#8fbcc4" opacity="0.7"/>
    <rect x="150" y="95" width="34" height="16" fill="#b0532b"/>
    <text x="75" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#43555f">Vasca di laminazione</text>
  </g>
</svg>
